<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QCM Droit informatique – Révision rapide</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7fb;--card:#fff;--tx:#1a1d29;--mu:#5b6275;--bd:#dde1ec;--ok:#1b7f3b;--okb:#e3f5e9;--ko:#c0392b;--kob:#fdecea;--wa:#d9730d;--wab:#fff3e3;--ac:#1f3a8a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141c;--card:#1c1f2b;--tx:#eceef5;--mu:#9aa1b5;--bd:#2f3446;--ok:#5fd58a;--okb:#16301f;--ko:#ff8a7a;--kob:#3a1c19;--wa:#ffad5c;--wab:#3a2a14;--ac:#8fa8ff}}
:root[data-theme="dark"]{--bg:#12141c;--card:#1c1f2b;--tx:#eceef5;--mu:#9aa1b5;--bd:#2f3446;--ok:#5fd58a;--okb:#16301f;--ko:#ff8a7a;--kob:#3a1c19;--wa:#ffad5c;--wab:#3a2a14;--ac:#8fa8ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;max-width:720px;margin:auto}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:10px 14px;border-bottom:1px solid var(--bd);z-index:5}
h1{font-size:18px;margin:0 0 6px;color:var(--ac)}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--mu)}
button{font:inherit;cursor:pointer}
.tb{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:5px 11px;font-size:13px}
.tb.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}
main{padding:12px 14px 40px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.q{font-weight:650;margin:0 0 8px}
.q small{color:var(--mu);font-weight:500;margin-right:4px}
.o{display:block;width:100%;text-align:left;border:1px solid var(--bd);background:transparent;color:var(--tx);border-radius:9px;padding:9px 10px;margin:5px 0}
.o.ok{background:var(--okb);border-color:var(--ok);color:var(--ok);font-weight:650}
.o.ko{background:var(--kob);border-color:var(--ko);color:var(--ko)}
.o.wa{background:var(--wab);border-color:var(--wa);color:var(--wa);font-weight:650}
.rv{border:1px dashed var(--ac);background:transparent;color:var(--ac);border-radius:9px;padding:8px 12px}
.ans{background:var(--okb);color:var(--ok);border-radius:9px;padding:8px 10px;margin:5px 0;font-weight:650}
.note{font-size:13px;color:var(--wa);margin-top:6px}
.hid{display:none}
</style></head><body>
<header><h1>QCM Droit informatique</h1>
<div class="bar"><span id="sc">Score : 0/0</span>
<button class="tb" id="bAll">Tout afficher</button>
<button class="tb" id="bRst">Recommencer</button>
<button class="tb" id="bShuf">Mélanger</button></div></header>
<main id="m"></main>
<script>
var D=[
["Une initiative de loi venant de l’assemblée est appelée :",["Proposition de loi","Projet de loi"],[0]],
["Faites correspondre : jurisprudence, loi, règlement, doctrine ↔ assemblée/parlement, professeurs, gouvernement, tribunaux",["Jurisprudence → Tribunaux","Loi → Parlement","Règlement → Gouvernement","Doctrine → Professeurs"],"o"],
["Étapes de mise en œuvre de la loi : relevons l’intrus",["Promulgation","Proposition","Adoption","Publication"],[1]],
["Les droits patrimoniaux portent sur le droit d’exploitation (reproduction, traduction), excepté le droit de retrait et de repentir.",["Vrai","Faux"],[0]],
["Hiérarchie décroissante (1 loi, 2 arrêté, 3 traités ratifiés, 4 décret, 5 constitution)",["5, 4, 1, 3, 2","1, 4, 2, 5, 3","5, 3, 1, 4, 2","1, 2, 5, 3, 4"],[2]],
["Droit de la famille (extra-patrimonial) : que comprend le droit alimentaire ?",["Droit du mariage","Autorité parentale","Éducation des enfants","Obligation alimentaire"],"o"],
["Domaines couverts par le droit de la personnalité",["Droit au nom","Droit au respect de sa vie privée","Droit à l’image","Droit à l’honneur"],"o"],
["Données que la loi informatique interdit de collecter",["Santé","Origine raciale, ethnique","Opinions politiques, philosophiques, religieuses","Appartenance (syndicale)"],"o"],
["Trois droits de la personne concernée",["Droit d’opposition (refuser)","Droit de rectification (modifier)","Droit d’accès"],"o"],
["Obligations du responsable de traitement",["Déclaration à la CIL","Garantir la sécurité des données"],"o","Seules 2 obligations étaient écrites sur ta feuille."],
["Sources d’obligation",["Par la loi","Par l’acte de volonté","Résultant d’une responsabilité"],"o"],
["Sources d’obligation : relevons l’intrus",["Involontaires résultant d’une responsabilité","Obligations de moyen","Résultant d’un acte de volonté","Imposée par la loi"],[1]],
["Acteurs ayant une obligation de moyen (a médecin, b SONABEL, c Air Burkina, d avocat)",["Médecin","SONABEL","Air Burkina","Avocat","Réponse b et c","Réponse a et d"],[5]],
["CIL : quelle structure n’est pas représentée ?",["Représentant de l’exécutif","Représentant de la société civile","Représentant des professionnels du droit","Représentant du législatif"],[2],"À vérifier : non coché sur la feuille."],
["Effets essentiels du contrat de vente",["Payer le produit","Effet translatif de propriété et en assurer la garantie","Livrer le produit","S’entendre sur le prix"],[1]],
["Résolution de litige (noms de domaine) : règle qui ne fait pas partie",["Nom enregistré et utilisé de mauvaise foi","Premier usage","Nom identique ou similaire","Titulaire sans droit légitime"],[1],"À vérifier : non coché sur la feuille."],
["Exemple de faute lourde",["Provocation volontaire de pannes","Erreurs importantes et répétées","Injures graves envers un supérieur","Insuffisance professionnelle"],[0],"À vérifier : non coché (faute lourde = intention de nuire)."],
["Qui n’est pas un élément constitutif d’une infraction ?",["Légal","Causes","Matériel","Moral"],[1]],
["Juridiction du litige salarié/employeur",["Conseil des prud’hommes","Tribunal de Grande Instance","Tribunal d’instance","Tribunal de commerce"],[0]],
["Conditions d’un marché de gré à gré",["Aucune offre satisfaisante enregistrée","Cas d’urgence impérieuse","Fournisseur titulaire d’un brevet"],"o"],
["Trois principaux critères de classification des contrats",["Type","Mode de formation","Objet"],"o"],
["Tribunaux : relevons l’intrus",["Tribunal d’instance","Tribunal de commerce","Tribunal de Grande Instance","Tribunal de proximité"],[3]],
["Délai de rétractation de 7 jours pour l’acheteur : quel cas ?",["Démarchage à domicile","Télé-achat","Vente par correspondance","Vente à distance"],[2]],
["Quelle cour relève d’un autre niveau ?",["Cour d’appel","Cour de cassation","Cour d’assises","Cour d’assises administratives"],[1]],
["Profession relevant du service public de la justice",["Avocat","Greffier","Notaire","Huissier de justice"],[1]],
["Relevons l’intrus",["Externalisation","Infogérance","Outsourcing","Convention"],[3]],
["Juridiction compétente pour les délits",["Cour de cassation","Tribunal correctionnel","Tribunal de police","Cour d’assises"],[1]],
["Ordre judiciaire : juridiction du dernier recours",["Cour d’appel","Cour de cassation","Conseil d’État","Tribunal administratif"],[1]],
["Sources directes de droit : relevons l’intrus",["Jurisprudence","Traité","Loi","Décret"],[0]],
["Rupture anticipée sauf un cas",["Accord","Terme","Faute grave","Force majeure"],[1]],
["Propriété industrielle : protection qui ne prend jamais fin",["Droit d’auteur","Marque","Nom commercial","Brevet"],[1]],
["Juridiction du domaine immobilier et des affaires familiales",["Conseil des prud’hommes","Tribunal de Grande Instance","Tribunal d’instance","Cour d’assises administrative"],[1]],
["Protection des logiciels : relevons l’intrus",["Architecture du programme","Interface","Matériel de conception","Code objet"],[1]],
["Contrats informatiques : obligations d’information, excepté",["D’information","D’accompagner","De renseigner","De mise en garde"],[1]],
["Contrat de vente : cas qui n’engage pas d’office le client",["Arrhes","Acompte","Erreur","Dol"],[0]]
];
var m=document.getElementById("m"),sc=document.getElementById("sc"),all=false,order,done,good;
function init(sh){order=D.map(function(_,i){return i});if(sh)order.sort(function(){return Math.random()-.5});done={};good=0;render()}
function upd(){var n=Object.keys(done).length;sc.textContent="Score : "+good+"/"+n}
function render(){m.innerHTML="";order.forEach(function(i,k){var d=D[i],c=document.createElement("div");c.className="card";
var q=document.createElement("p");q.className="q";q.innerHTML="<small>"+(i+1)+".</small>";q.appendChild(document.createTextNode(d[0]));c.appendChild(q);
var open=d[2]==="o";
if(open){var b=document.createElement("button");b.className="rv";b.textContent="Voir la réponse";var box=document.createElement("div");box.className="hid";
d[1].forEach(function(t){var a=document.createElement("div");a.className="ans";a.textContent="✔ "+t;box.appendChild(a)});
b.onclick=function(){box.classList.toggle("hid")};c.appendChild(b);c.appendChild(box);c._rv=box}
else{var bs=[];d[1].forEach(function(t,j){var o=document.createElement("button");o.className="o";o.textContent=t;bs.push(o);
o.onclick=function(){if(done[i]!==undefined)return;var ok=d[2].indexOf(j)>-1;done[i]=ok;if(ok)good++;show(bs,d,j);upd()};c.appendChild(o)});c._bs=bs;c._d=d;
if(done[i]!==undefined||all)show(bs,d,-1)}
if(d[3]){var n=document.createElement("div");n.className="note";n.textContent="⚠ "+d[3];c.appendChild(n)}
if(open&&all)c._rv.classList.remove("hid");m.appendChild(c)});upd()}
function show(bs,d,j){bs.forEach(function(o,x){var r=d[2].indexOf(x)>-1;o.className="o"+(r?(d[3]?" wa":" ok"):(x===j?" ko":""));if(r)o.textContent="✔ "+d[1][x]})}
document.getElementById("bAll").onclick=function(){all=!all;this.classList.toggle("on",all);render()};
document.getElementById("bRst").onclick=function(){all=false;document.getElementById("bAll").classList.remove("on");init(false)};
document.getElementById("bShuf").onclick=function(){all=false;document.getElementById("bAll").classList.remove("on");init(true)};
init(false);
</script></body></html>
